<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Get the materials</title><desc id="d">A colorful learning materials yard with packages, design plans, a calculator and children turning mathematics into quantities.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#fff3d2"/><stop offset="1" stop-color="#fffdf7"/></linearGradient></defs><rect width="1200" height="680" fill="url(#bg)"/><path d="M0 510h1200v170H0z" fill="#d9b782"/><rect x="75" y="75" width="1050" height="100" rx="30" fill="#173052"/><text x="600" y="120" text-anchor="middle" fill="#fff" font-family="Arial" font-size="38" font-weight="700">Turn Your Maths Into Materials</text><text x="600" y="153" text-anchor="middle" fill="#cfe3ff" font-family="Arial" font-size="22">Calculate • round • package • price</text><g transform="translate(85 235)"><rect width="320" height="220" rx="25" fill="#fff" stroke="#efcb70" stroke-width="5"/><text x="28" y="45" fill="#77520c" font-family="Arial" font-size="23" font-weight="700">MEZZO DESIGN CARD</text><path d="M40 95h240M55 125h170M55 155h205" stroke="#7aa4d8" stroke-width="10" stroke-linecap="round"/><circle cx="258" cy="154" r="32" fill="#5ac86d"/><text x="258" y="164" text-anchor="middle" fill="#fff" font-family="Arial" font-size="25" font-weight="700">?</text></g><g transform="translate(465 230)"><rect x="0" y="80" width="180" height="150" rx="14" fill="#f2ba55" stroke="#a86f22" stroke-width="5"/><path d="M0 80l90-52 90 52" fill="#ffd779" stroke="#a86f22" stroke-width="5"/><text x="90" y="158" text-anchor="middle" fill="#6c4718" font-family="Arial" font-size="25" font-weight="700">12</text><rect x="215" y="35" width="190" height="195" rx="20" fill="#eef4fb" stroke="#7895ba" stroke-width="5"/><rect x="245" y="65" width="130" height="45" rx="8" fill="#173052"/><g fill="#7aa1ce"><circle cx="260" cy="145" r="13"/><circle cx="310" cy="145" r="13"/><circle cx="360" cy="145" r="13"/><circle cx="2